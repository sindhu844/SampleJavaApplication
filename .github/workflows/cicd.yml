name: ci/cd workflow1
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'dev'

 # push:
  #  branches:
   #   - main
  # pull_request:
   # branches:
    #  - main

    
jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        version: [17, 11]
    steps:
      - name: checkout code from GitHub
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{matrix.version}}
      - name: Cache
        uses: actions/cache@v5.0.3
        with:
          path: ~/.m2/repository
          key: maven-${{hashFiles('pom.xml')}}
      - name: build the java app
        run: mvn clean install
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: test the java app
        run: mvn test
      - name: print env
        run: echo "environment is ${{inputs.environment}}"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      MY_SECRET: ${{ secrets.SAMPLE_SECRETE }}
    steps:
      - name: deploy
        run: echo "deploy application on ${{secrets.SAMPLE_SECRETE}}"
      - name: Check secret length
        run: |
          echo "Secret length: ${#MY_SECRET}"
        
