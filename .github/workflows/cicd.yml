name: ci/cd workflow1
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'dev'

 # push:
  #  branches:
   #   - main
  # pull_request:
   # branches:
    #  - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code from GitHub
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: build the java app
        run: mvn clean install
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: test the java app
        run: mvn test
      - name: print env
        run: echo "environment is ${{inputs.environment}}"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        run: echo "deploy application on ${{secrets.SAMPLE_SECRETE}}"
      - name: Check secret length
        run: echo "Secret length: ${#MY_SECRET}"
        env:
          MY_SECRET: ${{ secrets.SAMPLE_SECRETE }}
